{% extends "base.html" %}
{% block content %}
<section class="page-head">
  <p class="overline">Hakkımda</p>
  <h1>Merhaba, ben Murat</h1>
</section>

<div class="prose about-text">
  {{ site.about_html }}
  <p>Bana ulaşmak için: <a href="mailto:{{ site.email }}">{{ site.email }}</a></p>
  <div class="hero-actions">
    <a class="btn btn-primary" href="{{ site.social.github }}" target="_blank" rel="noopener">GitHub</a>
    <a class="btn btn-ghost" href="{{ site.social.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>
  </div>
</div>

<section class="section">
  <div class="section-head">
    <h2>Teknolojiler</h2>
  </div>
  <div class="skill-grid">
    {% for g in site.skill_groups %}
    <div class="card skill-group">
      <p class="overline">{{ g.name }}</p>
      <div class="skill-chips">
        {% for s in g['items'] %}<span class="skill-chip">{{ s }}</span>{% endfor %}
      </div>
    </div>
    {% endfor %}
  </div>
</section>
{% endblock %}
