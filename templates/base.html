<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} — {{ site.tagline }}{% endif %}</title>
  <meta name="description" content="{{ page.description }}">
  <meta name="author" content="{{ site.author }}">
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="/rss.xml">

  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:type" content="{{ page.type | default('website') }}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }} — {{ site.tagline }}{% endif %}">
  <meta property="og:description" content="{{ page.description }}">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta property="og:image" content="{{ site.url }}/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{ site.title }} — {{ site.tagline }}">
  <meta property="og:locale" content="tr_TR">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }} — {{ site.tagline }}{% endif %}">
  <meta name="twitter:description" content="{{ page.description }}">
  <meta name="twitter:image" content="{{ site.url }}/assets/og.png">
  {% if page.noindex %}<meta name="robots" content="noindex">{% endif %}
  {% if page.type == 'article' %}
  <meta property="article:published_time" content="{{ page.date_iso }}">
  <meta property="article:author" content="{{ site.author }}">
  {% for t in page.tags %}<meta property="article:tag" content="{{ t }}">
  {% endfor %}
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"BlogPosting","headline":"{{ page.title }}","datePublished":"{{ page.date_iso }}","dateModified":"{{ page.date_iso }}","inLanguage":"tr-TR","image":"{{ site.url }}/assets/og.png","author":{"@type":"Person","name":"{{ site.author }}","url":"{{ site.url }}"},"publisher":{"@type":"Person","name":"{{ site.author }}","url":"{{ site.url }}"},"description":"{{ page.description }}","keywords":"{{ page.tags | join(', ') }}","mainEntityOfPage":{"@type":"WebPage","@id":"{{ site.url }}{{ page.url }}"}}
  </script>
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Ana sayfa","item":"{{ site.url }}/"},{"@type":"ListItem","position":2,"name":"Blog","item":"{{ site.url }}/blog/"},{"@type":"ListItem","position":3,"name":"{{ page.title }}","item":"{{ site.url }}{{ page.url }}"}]}
  </script>
  {% else %}
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"Person","name":"{{ site.author }}","jobTitle":"{{ site.tagline }}","url":"{{ site.url }}","email":"mailto:{{ site.email }}","worksFor":{"@type":"Organization","name":"Arneca Teknoloji"},"alumniOf":{"@type":"CollegeOrUniversity","name":"Konya Teknik Üniversitesi"},"knowsAbout":["Android","Kotlin","Flutter","Dart","Mobil uygulama güvenliği","Spring Boot","Ktor","Go","LLM","Agent mimarileri"],"sameAs":["{{ site.social.github }}","{{ site.social.linkedin }}"]}
  </script>
  {% endif %}
  {% if page.url == '/' %}
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"WebSite","name":"{{ site.title }}","url":"{{ site.url }}","description":"{{ site.description }}","inLanguage":"tr-TR","publisher":{"@type":"Person","name":"{{ site.author }}"}}
  </script>
  {% endif %}

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/style.css">
  <script>
    (function(){
      var t = null;
      try { t = localStorage.getItem('theme'); } catch(e) {}
      if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
</head>
<body>
  <header class="nav-wrap">
    <nav class="nav container">
      <a class="logo" href="/">MA<span class="logo-dot">.</span></a>
      <div class="nav-links">
        <a href="/blog/">Blog</a>
        <a href="/projeler/">Projeler</a>
        <a href="/hakkimda/">Hakkımda</a>
        <button id="theme-toggle" aria-label="Tema değiştir" title="Tema değiştir">
          <svg class="sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/></svg>
          <svg class="moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </nav>
  </header>

  <main class="container">
  {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <p>© {{ year }} {{ site.author }} · <a href="/rss.xml">RSS</a></p>
      <div class="footer-social">
        <a href="{{ site.social.github }}" rel="me noopener" target="_blank" aria-label="GitHub">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.55 0-.27-.01-1.17-.02-2.12-3.2.7-3.87-1.36-3.87-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.19 1.76 1.19 1.03 1.75 2.69 1.25 3.34.95.1-.74.4-1.25.72-1.54-2.55-.29-5.23-1.28-5.23-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11.1 11.1 0 0 1 5.78 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.41-2.69 5.38-5.25 5.67.41.35.77 1.05.77 2.12 0 1.53-.01 2.76-.01 3.14 0 .3.2.67.8.55A11.52 11.52 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/></svg>
        </a>
        <a href="{{ site.social.linkedin }}" rel="me noopener" target="_blank" aria-label="LinkedIn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20.45 20.45h-3.55v-5.57c0-1.33-.03-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45z"/></svg>
        </a>
        <a href="mailto:{{ site.email }}" aria-label="E-posta">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/><path d="m3.5 6.5 8.5 6.5 8.5-6.5"/></svg>
        </a>
      </div>
    </div>
  </footer>

  <script>
    document.getElementById('theme-toggle').addEventListener('click', function(){
      var dark = document.documentElement.classList.toggle('dark');
      try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch(e) {}
    });

    var copyBtn = document.getElementById('copy-link');
    if (copyBtn) {
      copyBtn.addEventListener('click', function(){
        var url = copyBtn.getAttribute('data-url') || location.href;
        var done = function(){
          copyBtn.classList.add('copied');
          setTimeout(function(){ copyBtn.classList.remove('copied'); }, 1800);
        };
        var fallback = function(){
          var ta = document.createElement('textarea');
          ta.value = url; ta.setAttribute('readonly', '');
          ta.style.position = 'fixed'; ta.style.opacity = '0';
          document.body.appendChild(ta); ta.select();
          try { document.execCommand('copy'); done(); } catch(e) {}
          document.body.removeChild(ta);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(done, fallback);
        } else {
          fallback();
        }
      });
    }
  </script>
</body>
</html>
